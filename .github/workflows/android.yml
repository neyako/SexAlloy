name: Android CI

# Every push to main publishes a dev build (the `autobuild` prerelease the in-app nightly
# update check reads). Every RELEASE_EVERY-th change since the last stable release also
# publishes that same build as a stable `2.0.N` release, N being the version code.
# Only main publishes: a manual run started on any other branch is skipped.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a stable release now
        type: boolean
        default: false

env:
  RELEASE_EVERY: 4

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0

    - name: Plan version
      id: plan
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FORCE_RELEASE: ${{ inputs.release }}
      run: |
        # Releases rather than git tags: tags fetched from upstream NexAlloy are not ours.
        # On its own line so a failed request stops the run instead of looking like "no release yet".
        RELEASES=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')
        LAST=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$RELEASES" | sort -V | tail -n 1 || true)
        BASE=$(sed -n 's/^ *versionCode = \([0-9]\+\).*/\1/p' app/build.gradle.kts)
        [ -n "$BASE" ] || { echo "::error::versionCode not found in app/build.gradle.kts"; exit 1; }
        if [ -z "$LAST" ]; then
          CODE=$BASE
          RELEASE=true
        else
          # Dev builds already carry the next release's code, so they install over the last release.
          NEXT=$(( ${LAST##*.} + 1 ))
          CODE=$(( BASE > NEXT ? BASE : NEXT ))
          # First-parent: a merged branch (an upstream sync, a pull request) counts as one change.
          SINCE=$(git rev-list --count --first-parent "$LAST..HEAD")
          if [ "$SINCE" -ge "$RELEASE_EVERY" ] || [ "$FORCE_RELEASE" = "true" ]; then RELEASE=true; else RELEASE=false; fi
        fi
        sed -i "s/^\( *versionCode = \)[0-9]\+/\1$CODE/" app/build.gradle.kts
        VERSION=$(sed -n 's/^ *versionName = "\(.*\)\$versionCode"/\1/p' app/build.gradle.kts)$CODE
        echo "last=$LAST" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
        echo "Version $VERSION, last release ${LAST:-none}, ${SINCE:-0} changes since, release: $RELEASE"

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      run: |
        # Without the key the APK would be unsigned and no phone would install it.
        if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_ALIAS_PASSWORD" ]; then
          echo "::error::Add the KEYSTORE, KEYSTORE_PASSWORD, KEYSTORE_ALIAS and KEYSTORE_ALIAS_PASSWORD secrets"; exit 1
        fi
        # A pasted secret can carry line breaks or spaces.
        echo "$KEYSTORE" | tr -d '[:space:]' | base64 --decode > key.jks
        {
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS"
          echo "KEYSTORE_ALIAS_PASSWORD=$KEYSTORE_ALIAS_PASSWORD"
          echo "KEYSTORE_FILE=../key.jks"
        } > signing.properties

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Upload a Debug Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-debug-apk
        path: app/build/outputs/apk/debug

    - name: Upload a Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-release-apk
        path: |
          app/build/outputs/apk/release
          app/build/outputs/mapping/release/mapping.txt

    - name: Publish dev build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        LAST: ${{ steps.plan.outputs.last }}
      run: |
        COMMIT=$(git rev-parse --short HEAD)
        BUILD_TIME=$(TZ=UTC date --iso-8601=seconds)
        BUILD_TIME_TEXT=$(LC_ALL=C TZ=UTC date --date="$BUILD_TIME" '+%B %-d, %Y %H:%M')
        NOTES=$(mktemp)
        {
          echo "Dev build from commit ${COMMIT}."
          echo "Build time: <relative-time tense=\"past\" datetime=\"${BUILD_TIME}\">${BUILD_TIME_TEXT}</relative-time>"
          [ -z "$LAST" ] || echo "See changes: https://github.com/${{ github.repository }}/compare/${LAST}...main"
        } > "$NOTES"
        APK="NexAlloy-${COMMIT}.apk"
        cp app/build/outputs/apk/release/app-release.apk "$APK"

        git tag --force autobuild
        git push --force origin autobuild
        gh release view autobuild > /dev/null 2>&1 ||
          gh release create autobuild --prerelease --title "Dev Build" --notes-file "$NOTES"
        PREVIOUS_ASSETS=$(gh release view autobuild --json assets --jq '.assets[].name')
        gh release upload autobuild "$APK" --clobber
        gh release edit autobuild --prerelease --title "Dev Build" --notes-file "$NOTES"
        # The update check expects exactly one APK here.
        while IFS= read -r asset; do
          if [[ "$asset" == NexAlloy-*.apk && "$asset" != "$APK" ]]; then
            gh release delete-asset autobuild "$asset" --yes
          fi
        done <<< "$PREVIOUS_ASSETS"

    - name: Publish stable release
      if: steps.plan.outputs.release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.plan.outputs.version }}
        LAST: ${{ steps.plan.outputs.last }}
      run: |
        APK="NexAlloy-${VERSION}.apk"
        cp app/build/outputs/apk/release/app-release.apk "$APK"
        set -- --generate-notes
        [ -z "$LAST" ] || set -- "$@" --notes-start-tag "$LAST"
        gh release create "$VERSION" "$APK" --target "$GITHUB_SHA" --title "$VERSION" --latest "$@"
